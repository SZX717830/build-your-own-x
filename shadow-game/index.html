<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影子探险 - 小熊与手电筒</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    #title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4);
      padding: 8px 20px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    #controls-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      align-items: center;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
      justify-content: center;
    }

    .hint-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 4px;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
    }

    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      z-index: 100;
      transition: opacity 0.8s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-inner {
      text-align: center;
      color: rgba(255,255,255,0.6);
    }
    #loading-inner .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ffcc66;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-inner p { font-size: 14px; letter-spacing: 2px; }

    @media (max-width: 768px) {
      #title { font-size: 11px; padding: 6px 14px; top: 12px; }
      #controls-hint { font-size: 10px; padding: 8px 14px; gap: 10px; bottom: 16px; }
      .hint-icon { width: 16px; height: 16px; font-size: 8px; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div id="loading-inner">
      <div class="spinner"></div>
      <p>影子世界加载中...</p>
    </div>
  </div>

  <div id="ui-overlay">
    <div id="title">🔦 影子探险 · 小熊与手电筒</div>
    <div id="controls-hint">
      <span class="hint-item"><span class="hint-icon">🖱</span>左键拖动 · 移动手电筒</span>
      <span class="hint-item"><span class="hint-icon">↔</span>右键拖动 · 旋转视角</span>
      <span class="hint-item"><span class="hint-icon">⊕</span>滚轮 · 缩放</span>
      <span class="hint-item"><span class="hint-icon">↑↓</span>前后移动手电筒</span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
